name: akeyless

services:
  postgres:
    image: postgres:18
    container_name: postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  akeyless-gateway:
    image: akeyless/gateway:latest
    container_name: akeyless-gateway
    restart: unless-stopped

    env_file:
      - .gateway.env

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: postgres_data
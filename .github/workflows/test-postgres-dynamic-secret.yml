name: Test PostgreSQL Dynamic Secret with Docker

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Secret name
        required: true
        type: string
      target_name:
        description: Target name
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AKEYLESS_ACCESS_ID: ${{ secrets.AKEYLESS_ACCESS_ID }}
      AKEYLESS_ACCESS_KEY: ${{ secrets.AKEYLESS_ACCESS_KEY }}
      AKEYLESS_CLI_NON_INTERACTIVE: ${{ vars.AKEYLESS_CLI_NON_INTERACTIVE }}
      AKEYLESS_GATEWAY_URL: ${{ vars.AKEYLESS_GATEWAY_URL }}
      AKEYLESS_DEFAULT_LOCATION: ${{ vars.AKEYLESS_DEFAULT_LOCATION }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USERNAME: ${{ vars.POSTGRES_USERNAME }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Akeyless CLI
        run: |
          curl --fail --silent --show-error --location -o akeyless \
            https://akeyless-cli.s3.us-east-2.amazonaws.com/cli/latest/cli-linux-amd64
          chmod +x akeyless

      - name: Install script dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq postgresql-client

      - name: Configure Akeyless CLI Default Profile
        run: |
          ./akeyless configure --access-id "$AKEYLESS_ACCESS_ID" --access-key "$AKEYLESS_ACCESS_KEY"

      - name: Start Akeyless Gateway and PostgreSQL
        run: |
          printf 'GATEWAY_ACCESS_ID=%s\nGATEWAY_ACCESS_KEY=%s\n' \
            "$AKEYLESS_ACCESS_ID" "$AKEYLESS_ACCESS_KEY" > .gateway.env

          docker compose -f docker-compose.yaml up -d
          docker compose -f docker-compose.yaml exec -T akeyless-gateway \
            curl --fail --silent --show-error --retry 60 --retry-delay 5 \
              --retry-connrefused --retry-max-time 300 --max-time 5 \
              $AKEYLESS_GATEWAY_URL/health

      - name: Create PostgreSQL dynamic secret
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
          TARGET_NAME: ${{ inputs.target_name }}
        run: bash create-postgres-dynamic-secret.sh "$SECRET_NAME" "$TARGET_NAME"

      - name: Test PostgreSQL dynamic secret
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
        run: bash test-postgres-dynamic-secret.sh "$SECRET_NAME"
